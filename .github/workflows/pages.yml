name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# каждая новая публикация отменяет предыдущую — очереди не будет
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # на сайт нужны только index.html и assets/ — рабочие скриншоты и макеты не выкладываем
      - name: Remove non-site files
        run: rm -rf .git .github review review-live "review-live 2" mockups refs node_modules *.md index.html.bak screenshot-*.png

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
